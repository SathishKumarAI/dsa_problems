# The gates, run on every push and pull request.
#
# What this covers and what it does NOT, stated plainly so nobody reads a green tick
# as more than it is:
#
#   covered here  — typecheck, lint, 758 node tests, the production build, all 82
#                   teaching scripts, the content-drift gate, and `verify:code`
#                   (compiles every Java and C++ block against a real toolchain)
#   NOT covered   — `npm run test:ui` (real Chrome) and `verify:run` (runs the
#                   blocks and checks they agree with the Python). One needs a
#                   browser, the other is slow enough to be its own decision —
#                   see the `compile` job. Run them locally; the PR template asks
#                   for their output.
#
# So: a green tick here means "nothing obviously broke". It is not verification.
# See CONTRIBUTING.md, "The gates" — none of the seven is sufficient alone.

name: gates

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: typecheck · lint · tests · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: npm run check (tsc -b · eslint · node --test)
        run: npm run check

      - name: npm run build
        run: npm run build

  content:
    name: teaching scripts · content drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - run: npm ci

      # Every docs/deep/<id>_explained.md ends in one runnable script containing every
      # approach. This extracts the last Python fence, runs it, and requires it to print
      # ALL APPROACHES AGREED. It is the gate behind "nothing is stated that has not been run".
      - name: every teaching script runs and its approaches agree
        run: node scripts/verify-deep.mjs

      # Fails if a document teaches a rung the data file does not have without saying so.
      - name: no undisclosed approach additions
        run: node scripts/learn-gaps.mjs --strict

      # docs/learn/** is generated and no longer committed, so there is nothing to
      # drift. What is still worth proving is that the generator RUNS: `predev`,
      # `prebuild` and `pretest:ui` all depend on it, so a broken one breaks the app.
      - name: the learn-page generator runs
        run: npm run docs:learn

  # B28. `verify:code` compiles every Java and C++ block in src/data/problems/**
  # against a real compiler. The toolchain is user-space (`mise use -g
  # java@temurin-21`, `scoop install main/gcc`), so locally the gate bites only on
  # a machine that happens to have javac and g++ — and on CI it bit for nobody.
  # A contributor without the toolchain could land a block that does not compile
  # and the pull request stayed green. Here it bites for everyone.
  #
  # Its own job rather than steps in `content`: it runs in parallel with that one,
  # so installing a JDK costs no wall clock, and a failure names itself in the
  # checks list instead of hiding inside "teaching scripts · content drift".
  #
  # `verify:run` (execute the blocks, require the three languages to agree) is
  # deliberately NOT here. Its Windows-only .exe-launch flake would indeed go away
  # on Ubuntu, but the cost did not: it ran past ten minutes on the authoring
  # machine and would dominate the wall clock of every push, and it needs Python
  # on top of the JDK and g++. Compiling is the cheap half that catches the errors
  # a translation actually makes; running stays a local gate the PR template asks
  # for. Revisit if it is ever measured under ~3 minutes on a runner.
  compile:
    name: every Java and C++ block compiles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 for the `.ts` imports the script does (type stripping, no build).
      # No `npm ci`: verify.mjs imports src/data and node builtins only, nothing
      # from node_modules — measured by running it against a tree with none.
      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      # Temurin 21, matching the local `mise use -g java@temurin-21` pin — a block
      # that compiles here must compile on the machine that wrote it.
      # g++ is preinstalled on ubuntu-latest, so there is nothing to install.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # verify.mjs SKIPS the language whose compiler it cannot find, and exits 0
      # when it finds neither — correct locally, silent rot here. Prove both exist
      # before trusting the result below.
      - name: javac and g++ are both present
        run: javac -version && g++ --version

      - name: npm run verify:code (756 blocks today, 0 failing)
        run: npm run verify:code
