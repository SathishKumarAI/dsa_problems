    <!--
      THESIS: A page about measured algorithms is set in the colour language of
      scientific figures. It refuses the coding-education default: dark IDE
      chrome with one neon accent.
      OWN-WORLD: Two canonical systems, both colour-vision-safe by construction.
      Viridis for anything ORDERED (the ladder, cost bars): equal steps in data,
      equal steps in perceived lightness. Okabe-Ito for categorical roles (the
      chip grammar). Achromatic chrome on a cold near-black or cool near-white
      ground. One rule: colour means DATA; chrome never borrows it.
      STORY: The reader trusts the page because its colour carries information
      rather than decoration, and reads it as long as they like in either theme.
      FIRST VIEWPORT: Sticky orient bar of measured facts; the title and two
      actions on the one raised surface; the problem, its bounds drawn as
      figures. Colour appears first on a figure, never on chrome.
      FORM: Scientific colormaps and small-multiple figure plates; candidate 1
      of 7, chosen over the assigned roll (seed 634d1203).
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
